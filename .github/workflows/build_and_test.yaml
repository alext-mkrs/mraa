name: Build and test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build_and_test:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, arm, MOCK ]
        runs_on: [ ubuntu-22.04, ubuntu-24.04, ubuntu-26.04 ]
        run_tests: [ true ]
        # include:
          # - arch: x86_64
          #   runs_on: ubuntu-latest
          #   run_tests: true
          # - arch: arm
          #   runs_on: ubuntu-24.04-arm
          #   run_tests: true
          # - arch: MOCK
          #   runs_on: ubuntu-latest
          #   run_tests: true
    runs-on: ${{ (matrix.arch == 'arm' && format('{0}-arm', matrix.runs_on)) || matrix.runs_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3-dev libnode-dev swig libjson-c-dev git libgtest-dev

      - name: Build
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DBUILDSWIGNODE=on -DBUILDARCH=${{ matrix.arch }} ../
          ninja

      - name: Run tests
        if: matrix.run_tests
        run: |
          cd build
          ninja test
